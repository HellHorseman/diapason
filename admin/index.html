<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Админ-панель - Диапазон</title>
    <link href="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" rel="stylesheet">
</head>
<body>
<script>
    window.CMS_MANUAL_INIT = true;
</script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
        CMS.init({
            config: {
                load_config_file: false,
                backend: {
                    name: 'github',
                    repo: 'HellHorseman/diapason',
                    branch: 'main',
                    local_backend: false,
                    api_root: 'https://api.github.com',
                    site_domain: 'localhost:63342',
                    base_url: 'https://api.github.com',
                    auth_endpoint: 'https://github.com/login/oauth/authorize',
                },
                media_folder: 'images/uploads', // Глобальная папка (на случай, если где-то не указана своя)
                public_folder: '/images/uploads',
                // Включаем автоматическое приведение имён файлов к безопасному виду
                media_libraries: {
                    default: {
                        config: {
                            slugify_filename: true
                        }
                    }
                },
                collections: [
                    {
                        name: 'settings',
                        label: 'Настройки сайта',
                        label_singular: 'Настройка',
                        files: [
                            {
                                name: 'general',
                                label: 'Общие настройки',
                                file: 'data/content.json',
                                fields: [
                                    { label: 'Название компании', name: 'company_name', widget: 'string' },
                                    { label: 'Телефон', name: 'contact_phone', widget: 'string' },
                                    { label: 'Email', name: 'contact_email', widget: 'string' },
                                    { label: 'Адрес', name: 'contact_address', widget: 'string' }
                                ]
                            }
                        ]
                    },
                    // --- Коллекция для Света ---
                    {
                        name: 'gallery_light',
                        label: 'Галерея: Свет',
                        label_singular: 'Фото (Свет)',
                        folder: 'data/galleries/light',
                        create: false,
                        extension: 'json',
                        format: 'json',
                        // Указываем папку для загрузки именно этой коллекции
                        media_folder: 'images/light',
                        public_folder: '/images/light',
                        fields: [
                            { label: 'ID', name: 'id', widget: 'string', default: 'light', hidden: true },
                            { label: 'Фотографии', name: 'photos', widget: 'list', field: { label: 'Фото', name: 'image', widget: 'image' } }
                        ]
                    },
                    // --- Коллекция для Звука ---
                    {
                        name: 'gallery_sound',
                        label: 'Галерея: Звук',
                        label_singular: 'Фото (Звук)',
                        folder: 'data/galleries/sound',
                        create: false,
                        extension: 'json',
                        format: 'json',
                        media_folder: 'images/sound',
                        public_folder: '/images/sound',
                        fields: [
                            { label: 'ID', name: 'id', widget: 'string', default: 'sound', hidden: true },
                            { label: 'Фотографии', name: 'photos', widget: 'list', field: { label: 'Фото', name: 'image', widget: 'image' } }
                        ]
                    },
                    // --- Коллекция для Сцены ---
                    {
                        name: 'gallery_stage',
                        label: 'Галерея: Сцена',
                        label_singular: 'Фото (Сцена)',
                        folder: 'data/galleries/stage',
                        create: false,
                        extension: 'json',
                        format: 'json',
                        media_folder: 'images/stage',
                        public_folder: '/images/stage',
                        fields: [
                            { label: 'ID', name: 'id', widget: 'string', default: 'stage', hidden: true },
                            { label: 'Фотографии', name: 'photos', widget: 'list', field: { label: 'Фото', name: 'image', widget: 'image' } }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
